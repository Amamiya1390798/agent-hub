<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hub">
<meta name="application-name" content="Hub">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<title>Hub</title>
<style>
:root{
  --bg:#f3f1ea; --panel:#f9f8f3; --card:#ffffff; --line:#e3e0d6; --line2:#eeece4;
  --ink:#1d1c19; --muted:#6b6860; --faint:#a29f95; --hover:rgba(29,28,25,.05); --sel:rgba(29,28,25,.08);
  --ok:#2e8b57; --bad:#c4472d; --warn:#b3741a; --live:#2a6fdb;
  --gemini:#3b7cf0; --claude:#d2714f; --gpt:#12a37f; --ds:#7b5cf5;
  --shadow:0 1px 2px rgba(30,25,10,.05),0 8px 24px -12px rgba(30,25,10,.12);
  --r:14px; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#121211; --panel:#181817; --card:#1e1e1c; --line:#2c2b28; --line2:#252522;
  --ink:#ecebe5; --muted:#a3a097; --faint:#6c6961; --hover:rgba(255,255,255,.05); --sel:rgba(255,255,255,.09);
  --ok:#57c08a; --bad:#ec7358; --warn:#e0a84a; --live:#6aa5ff;
  --gemini:#6aa0ff; --claude:#e58b69; --gpt:#35c79f; --ds:#9d86ff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.6 var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
::selection{background:rgba(59,124,240,.25)}
.app{display:grid;grid-template-columns:300px minmax(0,1fr) 312px;height:100vh}
.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}

/* ---------- 左栏 ---------- */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.logo{width:26px;height:26px;border-radius:8px;background:var(--ink);position:relative;flex:none}
.logo i{position:absolute;width:7px;height:7px;border-radius:50%}
.logo i:nth-child(1){left:5px;top:5px;background:var(--gemini)}
.logo i:nth-child(2){right:5px;top:5px;background:var(--claude)}
.logo i:nth-child(3){left:5px;bottom:5px;background:var(--gpt)}
.logo i:nth-child(4){right:5px;bottom:5px;background:var(--ds)}
.brand b{font-size:16px;letter-spacing:.2px}
.conn{margin-left:auto;font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px}
.conn::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.conn.off{color:var(--bad)} .conn.off::before{background:var(--bad)}
.newbtn{margin:0 12px 10px;padding:9px 12px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.newbtn:hover{opacity:.88}
.search{margin:0 12px 8px;position:relative}
.search input{width:100%;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);outline:none}
.search input:focus{border-color:var(--faint)}
.filters{display:flex;gap:6px;padding:0 12px 8px}
.chip{padding:2px 10px;border-radius:99px;font-size:12px;color:var(--muted);border:1px solid var(--line)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{flex:1;padding:0 8px 12px;min-height:0}
.day{font-size:11px;color:var(--faint);padding:10px 8px 4px;letter-spacing:.5px}
.item{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:10px;margin-bottom:2px;position:relative}
.item:hover{background:var(--hover)} .item.sel{background:var(--sel)}
.item .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500;line-height:1.45;padding-right:22px;word-break:break-word}
.item .m{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:var(--faint)}
.item .st{position:absolute;right:10px;top:11px}
.iwrap{position:relative}
.iarch{position:absolute;right:4px;bottom:4px;width:28px;height:26px;border-radius:7px;color:var(--muted);font-size:13px;opacity:0;display:flex;align-items:center;justify-content:center}
.iwrap:hover .iarch,.iarch:focus-visible{opacity:1}
.iarch:hover{background:var(--line);color:var(--ink)}
@media (hover:none){.iarch{opacity:.7}}
.dots{display:inline-flex;gap:3px;margin-right:2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--faint)}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;overflow:hidden}
.gcard.has-sel{border-color:var(--faint)}
.gh{display:flex;align-items:stretch}
.gtog{width:28px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.gtog:hover{background:var(--hover);color:var(--ink)}
.gmain{flex:1;min-width:0;text-align:left;padding:9px 10px 9px 2px;position:relative}
.garch{width:30px;flex:none;color:var(--muted);font-size:13px;opacity:0;display:flex;align-items:center;justify-content:center}
.gcard:hover .garch,.garch:focus-visible{opacity:1}
.garch:hover{background:var(--hover);color:var(--ink)}
@media (hover:none){.garch{opacity:.7}}
.gmain:hover{background:var(--hover)} .gmain.sel{background:var(--sel)}
.gmain .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;line-height:1.45;padding-right:22px}
.gmain .m{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:12px;color:var(--faint);flex-wrap:wrap}
.gmain .st{position:absolute;right:10px;top:11px}
.gbody{border-top:1px solid var(--line2);padding:4px;background:var(--panel)}
.gitem,.gtask{display:flex;align-items:center;gap:5px;width:100%;text-align:left;padding:6px 8px;border-radius:7px;font-size:12.5px}
.gitem:hover,.gtask:hover{background:var(--hover)}
.gitem.sel{background:var(--sel);font-weight:600}
.gtasks{margin:1px 0 3px 12px;padding-left:8px;border-left:2px solid var(--line)}
.gtask{padding:4px 8px;font-size:12px;color:var(--muted)}
.gwho{font-weight:600;flex:none;color:var(--muted)}
.gsep{color:var(--faint);flex:none}
.gwhat{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gst{flex:none;margin-left:4px;font-size:11.5px;color:var(--faint)}
.gst.ok{color:var(--ok)} .gst.bad{color:var(--bad)} .gst.run{color:var(--live)}
.empty{color:var(--faint);text-align:center;padding:40px 16px;font-size:13px}

/* ---------- 状态图标 ---------- */
.ic{display:inline-flex;width:16px;height:16px;align-items:center;justify-content:center;border-radius:50%;font-size:10px;font-weight:700;flex:none}
.ic.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.ic.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.ic.skip,.ic.wait{background:var(--hover);color:var(--faint)}
.ic.run{border:2px solid color-mix(in srgb,var(--live) 25%,transparent);border-top-color:var(--live);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.badge{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:99px;font-size:12px;white-space:nowrap}
.badge.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.badge.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.badge.run{color:var(--live);background:color-mix(in srgb,var(--live) 12%,transparent)}
.badge.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.badge.plain{color:var(--muted);background:var(--hover)}

/* ---------- 中栏 ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.rail h3 span.x{display:inline-flex;gap:6px}
.topbar{display:none;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.iconbtn{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.view{flex:1;min-height:0}
.wrap{max-width:820px;margin:0 auto;padding:28px 28px 24px}
.hero{padding:9vh 0 10px;text-align:center}
.hero h1{font-size:28px;margin:0 0 8px;font-weight:650;letter-spacing:.3px}
.hero p{color:var(--muted);margin:0 0 22px}
.sugs{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
.sug{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-align:left;display:block;width:100%}
.sug:hover{border-color:var(--faint)}
.sug b{display:block;font-size:13px;margin-bottom:2px}
.sug span{color:var(--muted);font-size:12.5px}

.head{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}
.head h2{font-size:19px;line-height:1.45;margin:0;font-weight:650;flex:1;word-break:break-word;white-space:pre-wrap}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;color:var(--muted);font-size:12.5px;margin-bottom:14px}
.meta a{color:inherit}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.btn{padding:5px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--faint)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:default}
.sec{font-size:12px;color:var(--faint);letter-spacing:1px;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.note{padding:10px 14px;border-radius:12px;background:var(--hover);color:var(--muted);font-size:13px}
.note.bad{background:color-mix(in srgb,var(--bad) 9%,transparent);color:var(--bad);white-space:pre-wrap;word-break:break-word}
.plan{padding:12px 16px;border-left:3px solid var(--ink);background:var(--card);border-radius:0 12px 12px 0;box-shadow:var(--shadow)}

/* 过程 */
.steps{position:relative}
.step{position:relative;padding-left:44px;margin-bottom:8px}
.step::before{content:"";position:absolute;left:15px;top:34px;bottom:-10px;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.av{position:absolute;left:0;top:6px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;box-shadow:0 0 0 4px var(--bg)}
.av.busy{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--bg),0 0 0 4px transparent}50%{box-shadow:0 0 0 4px var(--bg),0 0 0 8px color-mix(in srgb,currentColor 0%,rgba(42,111,219,.28))}}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row>.rh{display:flex;align-items:center;gap:8px;padding:9px 12px;width:100%;text-align:left;flex-wrap:wrap}
.row>.rh:hover{background:var(--hover)}
.who{font-weight:650}
.what{flex:1;min-width:120px;word-break:break-word}
.dur{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{color:var(--faint);transition:transform .15s;font-size:11px}
.row.open>.rh .chev{transform:rotate(90deg)}
.rb{border-top:1px solid var(--line2);padding:12px 14px}
.sub{margin:10px 0 0 4px;padding-left:14px;border-left:2px dashed var(--line)}
.sub .row{margin-top:6px;background:var(--panel)}
.lab{font-size:12px;color:var(--faint);margin:10px 0 6px;display:flex;align-items:center;gap:8px}
.lab:first-child{margin-top:0}
.lab .copy{margin-left:auto}
.copy{font-size:12px;color:var(--muted);padding:1px 8px;border-radius:7px;border:1px solid var(--line)}
.copy:hover{color:var(--ink);border-color:var(--faint)}
pre.raw{margin:0;padding:10px 12px;background:var(--hover);border-radius:10px;white-space:pre-wrap;word-break:break-word;font:12.5px/1.6 var(--mono);max-height:260px;overflow:auto}
.result{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 22px;box-shadow:var(--shadow)}
.result img.gen{max-width:100%;max-height:460px;border-radius:10px;display:block;margin:4px 0 10px}

.sess{margin-top:10px;font-size:12px;color:var(--faint);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sess code{font:11.5px var(--mono)}
.livebox{border:1px dashed color-mix(in srgb,var(--live) 45%,var(--line));border-radius:10px;padding:10px 12px;margin-top:8px;background:color-mix(in srgb,var(--live) 4%,transparent)}
.livebox .lh{font-size:12px;color:var(--live);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.livebox .ls{font:11.5px/1.7 var(--mono);color:var(--muted);margin-bottom:6px;max-height:92px;overflow:auto}
.livebox .lt{max-height:340px;overflow:auto}
.livebox .lt .md::after{content:"▍";color:var(--live);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
/* Markdown */
.md{word-break:break-word}
.md>*:first-child{margin-top:0} .md>*:last-child{margin-bottom:0}
.md h1,.md h2,.md h3,.md h4{line-height:1.4;margin:1.2em 0 .5em;font-weight:650}
.md h1{font-size:1.3em}.md h2{font-size:1.18em}.md h3{font-size:1.06em}.md h4{font-size:1em}
.md p{margin:.6em 0}
.md ul,.md ol{margin:.5em 0;padding-left:1.5em}
.md li{margin:.2em 0}
.md code{font:.9em var(--mono);background:var(--hover);padding:.1em .4em;border-radius:5px}
.md pre{background:var(--hover);padding:12px 14px;border-radius:10px;overflow:auto;margin:.7em 0}
.md pre code{background:none;padding:0;font-size:12.5px;line-height:1.6}
.md blockquote{margin:.7em 0;padding:.2em 0 .2em 14px;border-left:3px solid var(--line);color:var(--muted)}
.md table{border-collapse:collapse;margin:.8em 0;display:block;overflow-x:auto;font-size:13px}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.md th{background:var(--hover);font-weight:650;white-space:nowrap}
.md hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.md a{color:var(--live)}

/* 输入区 */
.composer{padding:0 28px 18px}
.cbox{max-width:820px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px 8px}
.cbox:focus-within{border-color:var(--faint)}
.ctx{display:inline-flex;align-items:center;gap:6px;max-width:100%;font-size:12px;color:var(--muted);background:var(--hover);border-radius:8px;padding:2px 4px 2px 9px;margin-bottom:6px}
.ctx span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx button{width:18px;height:18px;border-radius:5px;flex:none}
.ctx button:hover{background:var(--sel)}
.ctx.off{color:var(--faint);background:transparent;border:1px dashed var(--line)}
.ctx.fork{color:var(--ink);background:var(--sel)}
.ag.off{opacity:.6}
.onoff{position:relative;display:inline-block;width:34px;height:20px;flex:none;cursor:pointer}
.onoff input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.onoff i{position:absolute;inset:0;border-radius:10px;background:var(--line);transition:.15s;pointer-events:none}
.onoff i::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:8px;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.onoff input:checked + i{background:var(--good,#2fa86a)}
.onoff input:checked + i::after{left:16px}
.onoff input:focus-visible + i{outline:2px solid var(--faint)}
.mlist{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.mgroup{display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.mgroup b{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}
.setting .mgroup label{display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:6px;text-align:left;width:100%;margin:0;padding:1px 0;font-weight:400}
.setting .mgroup label span{flex:0 1 auto;min-width:0;font-size:12.5px;color:var(--ink);font-weight:400;margin:0}
.setting .mgroup input{width:auto;flex:none;margin:0}
.mgroup em{font-style:normal;color:var(--faint);font-size:11.5px;margin-left:auto}
.handcard{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;background:var(--panel)}
.handcard .who{font-size:13px;font-weight:600;margin-bottom:6px}
.handcard details{margin-top:6px;font-size:13px}.handcard summary{cursor:pointer;color:var(--muted)}
.handpick{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:13px}
.handpick select{font:13px var(--sans);color:var(--ink);background:var(--hover);border:1px solid transparent;border-radius:7px;padding:3px 6px;max-width:100%}
.att{display:flex;flex-wrap:wrap;gap:6px}
.att:empty{display:none}
#att{margin-bottom:6px}
.att .th{position:relative;width:56px;height:56px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--hover);flex:none}
.att .th img{width:100%;height:100%;object-fit:cover;display:block}
.att .th button{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:9px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;line-height:18px;padding:0}
.att .th.up{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.thumbs a{display:block;width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.dropping{outline:2px dashed var(--faint);outline-offset:-4px}
.ctx.off button{width:auto;height:auto;padding:1px 7px;color:var(--ink)}
.sidewin{position:fixed;right:18px;bottom:18px;width:410px;max-width:calc(100vw - 24px);height:min(640px,calc(100vh - 36px));background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.28);display:flex;flex-direction:column;z-index:40}
.sidewin[hidden]{display:none}
.sw-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.sw-head .small{flex:1;margin:0}
.sw-hist{flex:1;overflow:auto;padding:10px 12px}
.sw-empty{color:var(--faint);font-size:13px;line-height:1.7;padding:6px 2px}
.sw-item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.sw-q{font-weight:500;white-space:pre-wrap;word-break:break-word}
.sw-meta{font-size:11.5px;color:var(--faint);margin:3px 0 6px}
.sw-err{font-size:12.5px;color:var(--bad)}
.sw-acts{display:flex;gap:6px;margin-top:6px}
.sw-acts .btn{font-size:12px;padding:3px 9px}
.sw-ctl{display:grid;grid-template-columns:auto 1fr;gap:5px 8px;align-items:center;padding:8px 12px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.sw-ctl select{min-width:0;font:12.5px var(--sans);color:var(--ink);background:var(--hover);border:1px solid transparent;border-radius:7px;padding:3px 4px}
.sw-ctl .two{display:flex;gap:6px;min-width:0}.sw-ctl .two select{flex:1}
.sw-ctl label.web{display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
#sw-txt{margin:8px 12px 0;width:calc(100% - 24px);resize:none;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--card);color:var(--ink);font:inherit;min-height:52px}
.sw-row{display:flex;align-items:center;gap:8px;padding:6px 12px 10px}

<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo"><i></i><i></i><i></i><i></i></div><b>Hub</b><span class="conn" id="conn">已连接</span></div>
    <button class="newbtn" data-act="new">＋ 新任务</button>
    <div class="search"><input id="q" placeholder="搜索记录…" autocomplete="off"></div>
    <div class="filters" id="filters"></div>
    <div class="list scroll" id="list"></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <button class="iconbtn menu" data-act="side" title="记录">☰</button>
      <b style="flex:1" id="tb-title">Hub</b>
      <button class="btn" data-act="sidewin" id="tb-side" title="开个小窗单独问个小问题，不影响主线">旁问</button>
      <button class="btn" data-act="rail" id="tb-team">团队</button>
      <div class="mtabs" id="mtabs" role="tablist"><button data-act="tab" data-v="list">记录</button><button class="on" data-act="tab" data-v="view">详情</button><button data-act="tab" data-v="team">团队</button></div>
    </div>

      <div class="cbox">

<script>
(function(){
"use strict";
const HUB_TOKEN = "__HUB_TOKEN__";
const $ = id => document.getElementById(id);
const AG = {
  gemini:{c:"var(--gemini)",l:"G",role:"主力干活：查资料、写初稿、写代码"},
  claude:{c:"var(--claude)",l:"C",role:"拍板定方案、审查把关"},
  gpt:{c:"var(--gpt)",l:"P",role:"拍板审查、画图"},
  ds:{c:"var(--ds)",l:"D",role:"翻译、改格式和简短问答"}
};
const agc = n => (AG[n]||{}).c || "var(--faint)";
const agl = n => (AG[n]||{}).l || esc((n||"?").slice(0,1).toUpperCase());

const CID = Math.random().toString(36).slice(2, 12);   // 本窗口的编号，后台据此知道已有窗口开着
addEventListener("pagehide", () => { try { navigator.sendBeacon("/api/bye?c=" + CID); } catch(e){} });
let uiVersion = 0, railBusyUntil = 0, settingsOpen = false, ppDraft = null;   // ppDraft：高压模式提示词还没保存的草稿
const agentDetails = new Set();
let S = null;                       // 最新状态
let sel = null;                     // {type:'run'|'call', id}；null = 新任务
let followLatest = false, pendingSubmission = null, pollSeq = 0, appliedPollSeq = 0, sending = false, stopTimer = 0;
const beginSubmit = () => { pendingSubmission = null; followLatest = true; };
let filter = "all", query = "";
let mode = "chat", allowWrite = localStorage.getItem("hub-write") === "1", showCwd = false, ctx = null;
let forking = false;
let handoffArm = null;                // 正在选「交接到哪一组」的那条记录 id
const pendImgs = {main: [], side: []};   // 还没发出去的图片 {id} 或 {up:true} 上传中                // 正在从 ctx 那条分叉出一条新线
let sideScope = "full";             // 旁问带上文的范围：full 完整上下文 / one 只带这一条
let sideOpen = false, sideAgent = null, sideSpec = "", sideEffort = "", sideWeb = true, sideBase = "main", sideFollow = null, sideSending = false;
let contact = localStorage.getItem("hub.contact") || "auto";   // 对接人：auto = 按阶段自动选
const open = new Set();             // 展开的行
const openGroups = new Set();       // 展开的项目组（默认全部收起）
const detail = {};                  // 完整记录缓存 key -> {sig, data, loading}
const last = {list:"", rail:"", view:"", modes:"", filters:""};
const prevStatus = {};
let stopArm = null;
let notify = localStorage.getItem("hub.notify") === "1";
let theme = localStorage.getItem("hub.theme") || "auto";

/* ---------- 工具 ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function dur(sec){
  if (sec == null || isNaN(sec)) return "";
  sec = Math.max(0, Math.round(sec));
  if (sec < 60) return sec + "秒";
  const m = Math.floor(sec/60), s = sec%60;
  if (m < 60) return m + "分" + (s ? s + "秒" : "");
  return Math.floor(m/60) + "小时" + (m%60 ? (m%60) + "分" : "");
}
const pad = n => String(n).padStart(2,"0");
function clock(ts){ const d = new Date(ts*1000); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function dayLabel(ts){
  const d = new Date(ts*1000), n = new Date();
  const a = new Date(d.getFullYear(), d.getMonth(), d.getDate()), b = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  const diff = Math.round((b-a)/86400000);
  return diff === 0 ? "今天" : diff === 1 ? "昨天" : (d.getMonth()+1) + "月" + d.getDate() + "日";
}
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600); }
async function api(path, body){
  const opt = body === undefined ? {} : {method:"POST", headers:{"Content-Type":"application/json","X-Hub-Token":HUB_TOKEN}, body:JSON.stringify(body)};
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({ok:false,error:"返回内容无法解析"}));
  if (r.status === 403 && body !== undefined){ location.reload(); throw new Error("页面已更新，请再试一次"); }
  if (!r.ok) throw new Error(j.error || ("出错了 " + r.status));
  return j;
}

/* ---------- 安全的 Markdown 渲染（先转义，再加标记） ---------- */
function inline(s){
  const codes = [];
  s = esc(String(s).replace(/[\u0000-\u0002]/g, "")).replace(/`([^`\n]+)`/g, (m,c) => { codes.push(c); return "\u0000" + (codes.length-1) + "\u0000"; });
  const links = [];
  s = s.replace(/\[([^\]\n]+)\]\(((?:[^()\s]|\([^()\s]*\))+)\)/g, (m,t,u) => {
    if (!/^https?:\/\//i.test(u)) return t;
    links.push(u.replace(/\u0000(\d+)\u0000/g, (m,i) => codes[+i])); return "\u0001" + (links.length-1) + "\u0001" + t + "\u0002";
  });
  s = s.replace(/\*\*([^*\n]+?)\*\*/g, "<strong>$1</strong>").replace(/__([^_\n]+?)__/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\w)/g, "$1<em>$2</em>").replace(/~~([^~\n]+?)~~/g, "<del>$1</del>");
  s = s.replace(/\u0001(\d+)\u0001/g, (m,i) => '<a href="' + links[+i] + '" target="_blank" rel="noopener noreferrer">').replace(/\u0002/g, "</a>");
  return s.replace(/\u0000(\d+)\u0000/g, (m,i) => "<code>" + codes[+i] + "</code>");
}
function md(src){
  const L = String(src || "").replace(/\r/g, "").split("\n"), out = [];
  let i = 0;
  const isList = l => /^(\s*)([-*+]|\d+[.)])\s+/.exec(l);
  const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  while (i < L.length){
    const l = L[i];
    let m;
    if (!l.trim()){ i++; continue; }
    if ((m = /^(\s*)(`{3,}|~{3,})/.exec(l))){
      const buf = [], fch = m[2][0], flen = m[2].length, ind = m[1].length; i++;
      const closes = x => { const t = x.trim(); return t.length >= flen && t.split("").every(ch => ch === fch); };
      while (i < L.length && !closes(L[i])) buf.push(L[i++].slice(Math.min(ind, L[i-1].search(/\S|$/))));
      i++; out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>"); continue;
    }
    if ((m = /^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/.exec(l))){ const n = Math.min(4, m[1].length); out.push("<h" + n + ">" + inline(m[2]) + "</h" + n + ">"); i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)){ out.push("<hr>"); i++; continue; }
    if (l.indexOf("|") >= 0 && i+1 < L.length && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(L[i+1])){
      const h = cells(l); i += 2; const rows = [];
      while (i < L.length && L[i].indexOf("|") >= 0 && L[i].trim()) rows.push(cells(L[i++]));
      out.push("<table><thead><tr>" + h.map(c => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>" +
        rows.map(r => "<tr>" + h.map((_,k) => "<td>" + inline(r[k] || "") + "</td>").join("") + "</tr>").join("") + "</tbody></table>");
      continue;
    }
    if (/^\s*>/.test(l)){
      const buf = [];
      while (i < L.length && /^\s*>/.test(L[i])) buf.push(L[i++].replace(/^\s*>\s?/, ""));
      out.push("<blockquote>" + md(buf.join("\n")) + "</blockquote>"); continue;
    }
    if (isList(l)){
      const stack = [];
      let html = "";
      while (i < L.length){
        const mm = isList(L[i]);
        if (!mm){
          if (/^\s*(`{3,}|~{3,})/.test(L[i])) break;
          if (L[i].trim() && /^\s{2,}/.test(L[i]) && stack.length){ html += "<br>" + inline(L[i].trim()); i++; continue; }
          if (!L[i].trim() && i+1 < L.length && isList(L[i+1])){ i++; continue; }
          break;
        }
        const ind = mm[1].length, type = /\d/.test(mm[2]) ? "ol" : "ul";
        while (stack.length && ind < stack[stack.length-1].ind){ html += "</li></" + stack.pop().type + ">"; }
        const tag = type === "ol" && parseInt(mm[2], 10) > 1 ? '<ol start="' + parseInt(mm[2], 10) + '">' : "<" + type + ">";
        if (!stack.length || ind > stack[stack.length-1].ind){ stack.push({ind, type}); html += tag + "<li>"; }
        else if (stack[stack.length-1].type !== type){ html += "</li></" + stack.pop().type + ">"; stack.push({ind, type}); html += tag + "<li>"; }
        else html += "</li><li>";
        html += inline(L[i].slice(mm[0].length)); i++;
      }
      while (stack.length) html += "</li></" + stack.pop().type + ">";
      out.push(html); continue;
    }
    const buf = [];
    while (i < L.length && L[i].trim() && !/^\s*(```|~~~|#{1,6}\s|>)/.test(L[i]) && !isList(L[i]) &&
           !(L[i].indexOf("|") >= 0 && i+1 < L.length && /^\s*\|?\s*:?-{2,}/.test(L[i+1]))) buf.push(L[i++]);
    if (!buf.length){ buf.push(L[i++]); }
    out.push("<p>" + buf.map(inline).join("<br>") + "</p>");
  }
  return out.join("");
}

/* ---------- 数据整理 ---------- */
const RUNNING = {running:1, planning:1, synthesizing:1};
function stInfo(st, err){
  if (st === "planning") return {k:"run", t:"规划中"};
  if (st === "synthesizing") return {k:"run", t:"汇总中"};
  if (st === "running") return {k:"run", t:"进行中"};
  if (st === "ok" || st === "done") return {k:"ok", t:"完成"};
  if (st === "pending") return {k:"wait", t:"等待中"};
  if (st === "skipped") return {k:"skip", t:"已跳过"};
  if (err === "已手动停止") return {k:"bad", t:"已停止"};
  return {k:"bad", t:"失败"};
}
const icon = k => '<span class="ic ' + k + '">' + (k === "ok" ? "✓" : k === "bad" ? "!" : k === "skip" ? "–" : k === "wait" ? "·" : "") + "</span>";
const badge = (k, t) => '<span class="badge ' + (k === "wait" || k === "skip" ? "plain" : k) + '">' + (k === "run" ? '<span class="ic run" style="width:10px;height:10px;border-width:1.5px"></span>' : "") + esc(t) + "</span>";
const tick = (start, end, secs) => secs != null ? '<span class="dur">' + dur(secs) + "</span>" : end ? '<span class="dur">' + dur(end - start) + "</span>" : '<span class="dur tick" data-start="' + start + '"></span>';

function items(){
  if (!S) return [];
  const out = [];
  for (const r of S.runs) out.push({type:"run", id:r.id, start:r.start, end:r.end, status:r.status, error:r.error,
    title:r.display || r.goal, follows:r.follows, fork:!!r.fork, council:r.mode === "council", pressure:!!r.pressure,
    agents:[r.planner].concat(r.tasks.filter(t => !t.skip_reason).map(t => t.agent), r.tasks.length > 1 ? [r.synthesizer] : []), rec:r});
  for (const c of S.calls) if (!c.run && !c.parent && c.kind !== "side") out.push({type:"call", id:c.id, start:c.start, end:c.end, status:c.status, error:c.error,
    title:c.display || (c.kind === "image" && c.title) || c.prompt_preview, follows:c.follows, fork:!!c.fork, image:c.kind === "image",
    agents:c.kind === "handoff" ? [] : [c.agent].concat(kids(c.id).map(x => x.agent)), rec:c});
  out.sort((a,b) => b.start - a.start);
  return out;
}
const findItem = s => s && items().find(i => i.type === s.type && i.id === s.id);
const kids = cid => S.calls.filter(c => c.parent === cid && (c.kind === "ask" || c.kind === "image")).sort((a,b) => a.start - b.start);
const uniq = a => a.filter((x,i) => x && a.indexOf(x) === i);
const ARCH_ICON = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><rect x="1.8" y="2.5" width="12.4" height="3.2" rx=".8"/><path d="M2.8 5.7v7a1 1 0 0 0 1 1h8.4a1 1 0 0 0 1-1v-7M6.3 8.6h3.4"/></svg>';
const akey = i => i.type + ":" + i.id;
const isArch = i => !!(S && S.archived && S.archived.indexOf(akey(i)) >= 0);
const nameOf = i => (S && S.names && S.names[akey(i)]) || i.title;   // 自动起的或你改的名字，没有就用第一句话
function groupOf(it){            // 这条记录所在的项目组（或它自己这一条单独提问）
  if (!it) return null;
  const {projects, solos} = groups();
  const g = projects.find(p => p.items.some(i => i.type === it.type && i.id === it.id));
  if (g) return {items: g.items, archived: g.archived, running: !!RUNNING[g.status], key: g.id, title: g.title, named: !!(S.names || {})[g.id], latest: g.latest};
  const s = solos.find(i => i.type === it.type && i.id === it.id) || it;
  return {items: [s], archived: isArch(s), running: !!RUNNING[s.status], key: akey(s), title: nameOf(s), named: !!(S.names || {})[akey(s)], latest: s};
}

function groups(){
  const all = items(), uf = {}, buckets = {};
  const find = x => { while (uf[x] && uf[x] !== x) x = uf[x] = uf[uf[x]] || uf[x]; return uf[x] || (uf[x] = x); };
  const union = (a, b) => { a = find(a); b = find(b); if (a !== b) uf[a] = b; };
  for (const i of all){
    const k = i.type + ":" + i.id;
    find(k);
    if (i.follows && i.follows.type && i.follows.id && !i.fork) union(k, i.follows.type + ":" + i.follows.id);   // 分叉另起一组
    if (i.type === "run" && i.rec && i.rec.parent_call) union(k, "call:" + i.rec.parent_call);
    if (i.type === "call" && i.rec && i.rec.dispatch && i.rec.dispatch.run) union(k, "run:" + i.rec.dispatch.run);
    if (i.type === "call" && i.rec && i.rec.handoff && i.rec.handoff.from) union(k, i.rec.handoff.from.type + ":" + i.rec.handoff.from.id);   // 交接过来的那组并进来
  }
  for (const i of all){
    const r = find(i.type + ":" + i.id);
    (buckets[r] || (buckets[r] = [])).push(i);
  }
  const prevKey = i => i.type === "run" && i.rec && i.rec.parent_call ? "call:" + i.rec.parent_call
    : i.follows && i.follows.type && i.follows.id && !i.fork ? i.follows.type + ":" + i.follows.id : null;
  const projects = [], solos = [];
  for (const list of Object.values(buckets)){
    if (list.length === 1 && list[0].type === "call" && list[0].rec.kind !== "chat" && !list[0].fork){
      solos.push(list[0]);
      continue;
    }
    const inSet = {};
    for (const i of list) inSet[i.type + ":" + i.id] = i;
    const depth = i => {
      let d = 0, cur = i;
      const seen = new Set();
      while (cur){
        const k = cur.type + ":" + cur.id;
        if (seen.has(k)) break;
        seen.add(k);
        const pk = prevKey(cur);
        if (!pk || !inSet[pk]) break;
        d++; cur = inSet[pk];
      }
      return d;
    };
    list.sort((a, b) => (a.start - b.start) || (depth(a) - depth(b)) || String(a.id).localeCompare(String(b.id)));
    let first = list[0];
    const latest = list[list.length - 1];
    const hand = list.find(i => i.rec && i.rec.handoff);
    if (hand){                          // 有交接：组名和开头以接收的那一组为准
      let cur = hand; const seen = new Set();
      while (cur && prevKey(cur) && inSet[prevKey(cur)] && !seen.has(cur)){ seen.add(cur); cur = inSet[prevKey(cur)]; }
      if (cur && cur !== hand) first = cur;
    }
    let runIt = null;
    for (let k = list.length - 1; k >= 0; k--) if (RUNNING[list[k].status]){ runIt = list[k]; break; }
    const runs = list.filter(i => i.type === "run");
    const ags = [];
    for (const i of list){
      for (const a of i.agents) ags.push(a);
      if (i.type === "run" && i.rec && i.rec.tasks) for (const t of i.rec.tasks) if (!t.skip_reason) ags.push(t.agent);
    }
    projects.push({
      id: first.type + ":" + first.id,
      title: nameOf(first),
      status: runIt ? runIt.status : latest.status,
      error: runIt ? runIt.error : latest.error,
      agents: uniq(ags),
      kind: (first.fork ? "⑂ 分叉 · " : "") + (runs.length ? (runs[runs.length - 1].council ? "会审" : runs[runs.length - 1].pressure ? "高压" : "协作") : "对话"),
      count: list.reduce((n, i) => n + (i.type === "run" ? Math.max(1, (i.rec.tasks || []).length) : 1), 0),
      time: Math.max(...list.map(i => i.start)),
      archived: list.every(isArch),
      latest: latest.type === "run" && latest.rec.parent_call ? (list.find(x => x.type === "call" && x.id === latest.rec.parent_call) || latest) : latest,
      items: list
    });
  }
  projects.sort((a, b) => b.time - a.time);
  solos.sort((a, b) => b.start - a.start);
  return {projects, solos};
}

  let h = headHtml(it, '<span>和对接人的对话 · ' + turns.length + ' 轮</span>' + (it.rec.chat && it.rec.chat.write ? '<span class="badge plain">可改文件</span>' : "")) + '<div class="chat">';
  for (const t of turns){
    const r = t.rec;
    if (r.kind === "handoff"){
      const full = need("call", r.id, "ok") || {}, hf = r.handoff || {}, key = "hand:" + r.id;
      if (full.answer) copyStore[key] = full.answer;
      h += '<div class="handcard"><div class="who">⇢ 交接进来：「' + esc(hf.name || "") + '」的结果</div>' +
        (hf.from ? '<button class="job" data-act="select" data-type="' + esc(hf.from.type) + '" data-id="' + esc(hf.from.id) + '">打开来源那一组</button>' : "") +
        '<button class="job" data-act="handoff-undo" data-id="' + esc(r.id) + '" title="去掉这次交接，两个项目组重新分开">↩ 撤销交接</button>' +
        '<details><summary>看交接的内容</summary>' + (full.answer ? '<div class="md">' + md(full.answer) + '</div>' : '<div class="small">载入中…</div>') + '</details></div>';
      continue;
    }
    h += '<div class="me">' + esc(t.title || "") + thumbsHtml(r.images) + "</div>";
    if (t.type === "run"){
      h += '<div class="them"><div class="who">团队（' + (r.mode === "council" ? "会审" : r.pressure ? "高压" : "自动分工") + '）</div><button class="job" data-act="select" data-type="run" data-id="' + esc(r.id) + '">打开这个项目组看过程 · ' + esc(stInfo(r.status, r.error).t) + "</button></div>";
      continue;
    }
    const full = r.kind === "chat" || r.kind === "ask" ? need("call", r.id, r.status + "|" + (r.secs || "") + "|" + (r.live || 0) + "|" + JSON.stringify(r.dispatch || {})) || {} : {};
    const ci = r.chat || {};
    h += '<div class="them"><div class="who" style="color:' + agc(r.agent) + '">' + esc(r.agent) + (r.kind === "chat" ? " · 对接人" + (ci.mode === "manual" ? "（你指定）" : "（自动选）") : "") + (r.resumed ? '<span class="small" title="直接接着上一轮的原会话，没有重发前文，缓存命中更高"> · 续接原会话</span>' : "") + "</div>";
    if (ci.handoff) h += '<div class="handoff">' + esc(ci.handoff) + "</div>";
    if (full.answer){ const key = "chat:" + r.id; copyStore[key] = full.answer; h += '<div class="md">' + md(full.answer) + '</div><div class="lab"><span></span><span><button class="copy" data-act="fork" data-type="call" data-id="' + esc(r.id) + '" title="带上到这一轮为止的对话，另开一条线">⑂ 从这里分叉</button><button class="copy" data-act="copy" data-key="' + esc(key) + '">复制</button></span></div>'; }
    else if (r.status === "running") h += liveHtml(full.live, r.agent);
    if (r.status === "fail" && !r.dispatch) h += errHtml(full.error || r.error || "没有回答", full.error_detail, full.partial, "chat:" + r.id);
    if (r.dispatch){
      const run = S.runs.find(x => x.id === r.dispatch.run);
      const si = run ? stInfo(run.status, run.error) : {k:"run", t:"准备中"};
      const done = run ? run.tasks.filter(x => x.status === "ok").length : 0;
      h += '<button class="job" data-act="select" data-type="run" data-id="' + esc(r.dispatch.run || "") + '">📋 派给团队（' + (r.dispatch.mode === "council" ? "会审" : "自动分工") + '）：' + esc((r.dispatch.goal || "").slice(0, 80)) +
        '<br><span class="small">' + esc(si.t) + (run && run.tasks.length ? " · 已完成 " + done + "/" + run.tasks.length + " 件" : "") + " · 点开看每个人的过程和结果</span>" + (run && run.tasks.length ? taskChips(run.tasks) : "") + "</button>";
    }
    h += "</div>";
  }
  return h + "</div>";
}

function councilHint(cfg, cq, cm){      // 和后端同样的规则：低额度跳过，综合者低额度时换成可用的第一位
  const ok = cm.filter(n => !cq[n]), skip = cm.filter(n => cq[n]);
  const tail = skip.length ? "；额度不足将跳过 " + skip.join("、") : "";
  if (!ok.length) return "会审：现在没有额度充足的成员，发出去会直接结束" + tail;
  if (ok.length === 1) return "会审：只有 " + ok[0] + " 额度充足，只会得到一位的意见，不算多方会审" + tail;
  const synth = cq[cfg.synthesizer] ? ok[0] : cfg.synthesizer;
  return "会审：" + ok.join("、") + " 各自独立作答 → " + synth + " 比较共同点和分歧（只读，不改文件）" + tail;
}

/* ---------- 轮询、通知、计时 ---------- */
function ticks(){
  const now = Date.now()/1000;
  document.querySelectorAll(".tick").forEach(el => { const t = dur(now - parseFloat(el.dataset.start)); if (el.textContent !== t) el.textContent = t; });
}
function checkDone(){
  const its = items();
  let running = 0;
  for (const i of its){
    const key = i.type + i.id, was = prevStatus[key];
    if (RUNNING[i.status]) running++;
    if (was && RUNNING[was] && !RUNNING[i.status]){
      const si = stInfo(i.status, i.error);
      if (notify && (document.hidden || !document.hasFocus() || !sel || sel.id !== i.id)){
        if (window.Notification && Notification.permission === "granted"){
          const n = new Notification("Hub · " + si.t, {body:(i.title || "").slice(0, 80), tag:key});
          n.onclick = () => { window.focus(); select(i.type, i.id); };
        } else if (!window.Notification) api("/api/notify", {title:"Hub · " + si.t, body:(i.title || "").slice(0, 80)}).catch(() => {});
      }
    }
    prevStatus[key] = i.status;
  }
  document.title = (running ? "(" + running + ") " : "") + "Hub";
}
async function poll(){
  const seq = ++pollSeq;
  try {
    const st = await api("/api/state?c=" + CID);
    if (seq < appliedPollSeq) return;     // 只丢弃比已显示状态更旧的响应
    appliedPollSeq = seq;
    if (uiVersion && st.ui_version && st.ui_version !== uiVersion && !$("txt").value.trim()){ location.reload(); return; }   // 界面有新版，自动刷新
    uiVersion = uiVersion || st.ui_version;
    S = st;
    $("conn").className = "conn"; $("conn").textContent = "已连接";
  } catch(e){ if (seq >= appliedPollSeq){ appliedPollSeq = seq; $("conn").className = "conn off"; $("conn").textContent = "连接断开"; } return; }
  if (followLatest && pendingSubmission){
    const n = items().find(i => i.rec.submission_id === pendingSubmission);
    if (n){ sel = {type:n.type, id:n.id}; ctx = sel; followLatest = false; }
  }
  checkDone(); renderList(); renderRail(); renderView(); renderComposer(); renderSide();
}

/* ---------- 事件 ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, it = findItem(sel);
  if (el.tagName === "A") e.preventDefault();
  try {
    if (act === "new") select(null);
    else if (act === "select") select(el.dataset.type, el.dataset.id);
    else if (act === "keep-close"){
      if (el.dataset.id === "all" && !confirm("关掉所有开着的 Gemini 会话？正在回答的也会中断。")) return;
      await api("/api/keep/close", {id: el.dataset.id}); poll();
    }
    else if (act === "group"){
      const k = el.dataset.id;
      openGroups.has(k) ? openGroups.delete(k) : openGroups.add(k);
      renderList();
    }
    else if (act === "filter"){ filter = el.dataset.v; renderList(); }
    else if (act === "archive"){
      const keys = (el.dataset.keys || "").split(" ").filter(Boolean), on = el.dataset.on === "1";
      if (!keys.length) return;
      await api("/api/archive", {keys, on});
      const cur = S.archived || [];
      S.archived = on ? cur.concat(keys.filter(k => cur.indexOf(k) < 0)) : cur.filter(k => keys.indexOf(k) < 0);
      last.list = ""; last.view = ""; last.filters = ""; renderList(); renderView();
      toast(on ? "已归档，点左上「已归档」能找回" : "已放回列表");
    }
    else if (act === "toggle"){
      const k = el.dataset.key, isOpen = el.parentNode.classList.contains("open");
      if (isOpen){ open.delete(k); closed.add(k); } else { open.add(k); closed.delete(k); }
      renderView();
    }
    else if (act === "copy"){
      const k = el.dataset.key, txt = copyStore[k] || "";
      try { await navigator.clipboard.writeText(txt); }
      catch(e2){ const ta = document.createElement("textarea"); ta.value = txt; ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
      toast("已复制");
    }
    else if (act === "mode"){ mode = el.dataset.v; saveDraft(); renderComposer(); $("txt").focus(); }
    else if (act === "write"){ allowWrite = !allowWrite; try { localStorage.setItem("hub-write", allowWrite ? "1" : "0"); } catch (e2){} renderComposer(); }   // 记住：下次打开还是这个选择
    else if (act === "cwd"){ showCwd = !showCwd; renderComposer(); if (showCwd) $("cwd").focus(); }
    else if (act === "noctx"){ if (forking){ forking = false; ctx = sel; } else ctx = null; renderComposer(); }
    else if (act === "fork"){ ctx = {type: el.dataset.type, id: el.dataset.id}; forking = true; renderComposer(); $("txt").focus(); toast("已准备分叉：发出的话会另开一条线"); }
    else if (act === "yesctx"){ ctx = sel; renderComposer(); $("txt").focus(); }
    else if (act === "sidewin"){ sideOpen = !sideOpen; last.side = last.sideCtl = last.rail = ""; renderSide(); renderRail(); if (sideOpen) $("sw-txt").focus(); }
    else if (act === "side-send") await sendSide();
    else if (act === "handoff-arm"){ handoffArm = el.dataset.id; last.view = ""; renderView(); }
    else if (act === "handoff-undo"){
      if (!confirm("撤销这次交接？两个项目组会重新分开，交接内容不再带给后面的追问。")) return;
      try { const r = await api("/api/handoff/undo", {id: el.dataset.id}); toast("已撤销交接"); await poll(); if (r.back) select(r.back.type, r.back.id); else select(null); }
      catch (e){ toast(e.message || "撤销失败"); }
    }
    else if (act === "handoff-cancel"){ handoffArm = null; last.view = ""; renderView(); }
    else if (act === "rename"){
      const v = prompt("给它起个名字（清空就恢复成自动的名字）", el.dataset.name || "");
      if (v === null) return;
      const name = v.trim().slice(0, 60);
      await api("/api/rename", {key: el.dataset.key, name});
      S.names = Object.assign({}, S.names); if (name) S.names[el.dataset.key] = name; else delete S.names[el.dataset.key];
      last.list = last.view = ""; renderList(); renderView();
      toast(name ? "已改名" : "已恢复自动名字");
      if (!name) poll();
    }
    else if (act === "title-backfill"){ await api("/api/title/backfill", {}); toast("开始给已有的项目组起名，起好会陆续显示"); poll(); }
    else if (act === "att-pick") $(el.dataset.w === "side" ? "file-side" : "file-main").click();
    else if (act === "att-del"){ pendImgs[el.dataset.w].splice(+el.dataset.i, 1); renderAtt(el.dataset.w); }
    else if (act === "side-follow"){ sideFollow = {type:"call", id:el.dataset.id}; sideBase = "follow"; last.sideCtl = ""; renderSide(); $("sw-txt").focus(); }
    else if (act === "send") send();
    else if (act === "sug"){
      const s = viewNew.sug[+el.dataset.i];
      if ($("txt").value.trim() && $("txt").value !== s[0]){ toast("输入框里已有文字，先清空再选模板"); return; }
      $("txt").value = s[0]; mode = s[1]; if (mode === "council") allowWrite = false; saveDraft(); autosize(); renderComposer(); $("txt").focus();
    }
    else if (act === "side"){ document.body.classList.toggle("side-open"); syncTabs(); }
    else if (act === "settings"){ settingsOpen = !settingsOpen; railBusyUntil = 0; if (settingsOpen) loadPair(); renderRail(); $("rail").scrollTop = 0; }
    else if (act === "tab"){
      const v = el.dataset.v;
      document.body.classList.toggle("side-open", v === "list");
      document.body.classList.toggle("rail-open", v === "team");
      syncTabs();
    }
    else if (act === "lan"){
      const on = el.dataset.v === "1";
      if (on && !confirm("打开后，同一个 Wi-Fi 里配对过的手机可以控制 Hub。确定打开吗？")) return;
      el.disabled = true;
      await api("/api/lan", {enable: on});
      toast(on ? "已打开，面板正在重启…" : "已关闭，面板正在重启…");
      setTimeout(() => location.reload(), 2500);   // 面板换了监听地址，页面要重新载入
    }
    else if (act === "pair-reset"){
      if (!confirm("重置后，已经配对的手机全部要重新扫码。确定吗？")) return;
      await api("/api/pair/reset", {}); pairInfo = null; loadPair(); toast("配对码已重置");
    }
    else if (act === "pp-save"){
      const box = $("pp"), v = box ? box.value : (ppDraft || "");
      el.disabled = true;
      try { await api("/api/config", {pressure_prompt: v}); ppDraft = null; toast(v.trim() ? "高压模式提示词已保存" : "已清空高压模式提示词"); }
      catch(err){ toast(err.message); }
      el.disabled = false; last.rail = ""; poll();
    }
    else if (act === "agent-details"){ const n = el.dataset.agent; agentDetails.has(n) ? agentDetails.delete(n) : agentDetails.add(n); railBusyUntil = 0; renderRail(); }
    else if (act === "rail"){ document.body.classList.toggle("rail-open"); syncTabs(); }
    else if (act === "closedrawers"){ document.body.classList.remove("side-open", "rail-open"); syncTabs(); }
    else if (act === "goto"){
      const run = el.dataset.run, cid = el.dataset.call;
      if (run) select("run", run);
      else { let c = S.calls.find(x => x.id === cid); while (c && c.parent) c = S.calls.find(x => x.id === c.parent); if (c) c.run ? select("run", c.run) : select("call", c.id); }
    }
    else if (act === "stop" && it){
      clearTimeout(stopTimer);
      if (el.dataset.sure){ el.disabled = true; el.textContent = "正在停止…"; delete el.dataset.act; stopArm = null; await api("/api/stop", el.dataset.type ? {type: el.dataset.type, id: el.dataset.id} : sel); toast("已停止"); poll(); }
      else { stopArm = el.dataset.id || sel.id; renderView(); stopTimer = setTimeout(() => { stopArm = null; renderView(); }, 4000); }
    }
    else if (act === "retry" && it){
      const r = it.rec;
      let text = it.type === "run" ? (r.display || r.goal) : r.display;
      if (!text){ const full = await api("/api/call?id=" + encodeURIComponent(r.id)); text = full.display || full.prompt; }
      if (!text) throw new Error("找不到原始指令，没法重新执行");
      const body = it.type === "run" ? (r.mode === "council" ? Object.assign({mode:"council", text, cwd:r.cwd}, (r.participants || []).length >= 2 ? {agents:r.participants} : {}, r.synthesizer ? {synthesizer:r.synthesizer} : {}) : {mode:r.pressure ? "pressure" : "run", text, cwd:r.cwd, write:!!r.write})
        : r.kind === "chat" ? {mode:"chat", agent:(r.chat && r.chat.mode === "manual") ? r.agent : "auto", text, cwd:r.cwd, write:!!(r.chat && r.chat.write)}
        : {mode:r.kind === "image" ? "image" : "ask", agent:r.agent, text, cwd:r.cwd, write:!!r.write};
      if (r.follows) body.context = r.follows;
      if (r.follows && r.fork) body.fork = true;
      if (isRemote()){
        body.cwd = "";
        if (body.write || body.mode === "image"){
          if (!confirm(body.mode === "image" ? "画图会在电脑上保存图片文件，确定吗？" : "这条原本允许改文件，重新执行也会改动电脑上的文件，确定吗？")) return;
          body.confirm_write = true;
        }
      }
      beginSubmit();
      const accepted = await api("/api/submit", body);
      if (followLatest) pendingSubmission = accepted.submission_id;
      toast("已重新下达"); poll();
    }
    else if (act === "opendir" && it) await api("/api/open", sel);
    else if (act === "reveal" && it) await api("/api/open", {type:sel.type, id:sel.id, what:"image"});
    else if (act === "quota"){ await api("/api/quota", {}); toast("正在刷新额度"); setTimeout(poll, 4000); }
    else if (act === "login"){ await api("/api/login", {agent: el.dataset.agent}); toast("已打开登录窗口，按里面的提示操作"); }
    else if (act === "health"){ await api("/api/health", {}); toast("开始体检，大约半分钟"); poll(); }
    else if (act === "notify"){
      if (notify){ notify = false; }
      else if (!window.Notification){ notify = true; api("/api/notify", {title:"Hub", body:"通知已开启：任务完成时会在这里提醒你"}).catch(() => {}); }
      else { const p = await Notification.requestPermission(); notify = p === "granted"; if (!notify) toast("通知权限被拒绝了，可在浏览器设置里打开"); }
      localStorage.setItem("hub.notify", notify ? "1" : "0"); last.rail = ""; renderRail();
    }
  } catch(err){
    if (act === "stop"){ stopArm = null; last.view = ""; renderView(); }
    if (act === "retry") followLatest = false;
    toast(err.message || "出错了");
  }
});
document.addEventListener("change", async e => {
  const el = e.target;
  if (el.id === "contact"){ contact = el.value; localStorage.setItem("hub.contact", contact); last.modes = ""; renderComposer(); return; }
  if (el.id === "theme"){ theme = el.value; last.rail = ""; localStorage.setItem("hub.theme", theme); applyTheme(); return; }
  if (el.dataset && el.dataset.chain){
    const p = el.dataset.chain.split(":");
    try { await api("/api/config", {chain:{agent:p[0], index:+p[1], spec:el.value}}); toast(el.dataset.gem ? p[0] + " 的思考等级已改成「" + el.options[el.selectedIndex].text + "」，下次干活生效" : p[0] + " 的" + (+p[1] ? "后备" : "首选") + "已换成 " + el.options[el.selectedIndex].text); el.blur(); last.rail = ""; poll(); }
    catch(err){ toast(err.message); el.blur(); last.rail = ""; poll(); }
    return;
  }
  if (el.dataset && el.dataset.handoff && el.value){
    const it = findItem(sel), me = it && groupOf(it), src = me && chainEnd(me.latest);
    const opt = el.options[el.selectedIndex], dstTitle = opt.dataset.title || opt.text, [type, id] = el.value.split(":");
    if (!src || !confirm("把「" + (me.title || "") + "」做出来的结果交接到「" + dstTitle + "」？\n之后在那一组接着问，就会带上这些内容；两组会在左边合成一组。")){ el.value = ""; return; }
    try {
      const r = await api("/api/handoff", {from: {type: src.type, id: src.id}, to: {type, id}, title: me.title || ""});
      handoffArm = null; toast("已交接到「" + dstTitle + "」，在那边接着问就能用上"); await poll(); select("call", r.id);
    } catch(err){ toast(err.message || "没交接成功"); el.value = ""; }
    return;
  }
  if (el.dataset && (el.dataset.agentOn || el.dataset.model)){
    const body = el.dataset.agentOn ? {agent_enabled: {agent: el.dataset.agentOn, on: el.checked}} : {model_enabled: {spec: el.dataset.model, on: el.checked}};
    try { await api("/api/config", body); toast((el.dataset.agentOn || el.parentNode.textContent.trim().slice(0, 30)) + (el.checked ? " 已启用" : " 已停用")); }
    catch(err){ el.checked = !el.checked; toast(err.message); }
    el.blur(); last.rail = ""; last.modes = ""; last.contact = ""; poll(); return;
  }
  if (el.dataset && el.dataset.sw){
    const k = el.dataset.sw;
    if (k === "agent"){ sideAgent = el.value; sideSpec = ""; sideEffort = ""; }
    else if (k === "spec"){ sideSpec = el.value; sideEffort = ""; }
    else if (k === "effort") sideEffort = el.value;
    else if (k === "base") sideBase = el.value;
    else if (k === "scope") sideScope = el.value === "one" ? "one" : "full";
    else if (k === "web") sideWeb = el.checked;
    el.blur(); last.sideCtl = ""; renderSide(); return;
  }
  if (el.dataset && el.dataset.effort){
    try { await api("/api/config", {effort:{agent:el.dataset.effort, level:el.value}}); toast(el.dataset.effort + " 的思考等级已改成「" + el.options[el.selectedIndex].text + "」，下次干活生效"); }
    catch(err){ toast(err.message); }
    el.blur(); last.rail = ""; poll(); return;
  }
  if (el.dataset && el.dataset.council){
    const picked = Array.from(document.querySelectorAll("[data-council]")).filter(x => x.checked).map(x => x.dataset.council);
    try { await api("/api/config", {council_agents: picked}); toast("会审成员已保存"); } catch(err){ toast(err.message); }
    last.rail = ""; poll(); return;
  }
  if (el.dataset && el.dataset.cfg){
    const v = el.dataset.bool ? el.value === "1" : el.type === "number" ? Math.round(parseFloat(el.value) * (parseFloat(el.dataset.scale) || 1)) : el.value;
    try { await api("/api/config", {[el.dataset.cfg]: v}); toast("已保存"); el.blur(); last.rail = ""; poll(); } catch(err){ toast(err.message); el.blur(); last.rail = ""; poll(); }
  }
});
["mousedown", "keydown", "input"].forEach(ev => $("rail").addEventListener(ev, e => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") railBusyUntil = Date.now() + 8000;
}));
$("rail").addEventListener("change", () => { railBusyUntil = 0; });
$("rail").addEventListener("input", e => { if (e.target.id === "pp") ppDraft = e.target.value; });
$("q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); renderList(); });
function saveDraft(){   // 草稿只存在当前窗口；不保存「允许改文件」，恢复后它仍是关闭的
  try { const v = $("txt").value; v.trim() ? sessionStorage.setItem("hub.draft", JSON.stringify({text:v, mode})) : sessionStorage.removeItem("hub.draft"); } catch(e){}
}
$("txt").addEventListener("input", () => { autosize(); saveDraft(); $("send").disabled = sending || !$("txt").value.trim(); });
$("txt").addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)){ e.preventDefault(); send(); } });
bindImageInput("main", "txt", () => document.querySelector && document.querySelector(".cbox"), "file-main");
bindImageInput("side", "sw-txt", () => $("sidewin"), "file-side");
$("sw-txt").addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)){ e.preventDefault(); sendSide(); } });
$("sw-txt").addEventListener("input", () => { $("sw-send").disabled = sideSending || !$("sw-txt").value.trim(); });

try {
  const raw = sessionStorage.getItem("hub.draft");
  if (raw){
    let d; try { d = JSON.parse(raw); } catch(e){ d = null; }
    if (!d || typeof d !== "object" || typeof d.text !== "string") d = {text: raw};   // 兼容旧版纯文字草稿
    $("txt").value = d.text;
    if (typeof d.mode === "string" && d.mode) mode = d.mode;
    autosize();
  }
} catch(e){}
applyTheme(); renderComposer();
poll(); setInterval(poll, 1500); setInterval(ticks, 1000);
})();
</script>
</body>
